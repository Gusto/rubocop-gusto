name: Release Gem

on:
  release:
    types: [published]

jobs:
  release:
    if: github.repository == 'gusto/rubocop-gusto'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: false
          ruby-version: ruby
      - name: Install gems
        run: bundle install --jobs 4

      # Release
      # Held at v1.2.0: it is the newest release-gem whose bundled
      # rubygems/configure-rubygems-credentials SHA (v1.0.0, bc6dd21) passes Gusto's
      # GitHub Actions allowlist. v1.3.0 moved to credentials v2.0.0 and v1.4.x to
      # v2.1.0, neither of which is allowlisted, so every release from v11.5.0 to
      # v11.7.1 died before publishing and no gem has reached rubygems.org since
      # v11.3.0. Unpin once the newer SHA is allowlisted -- see dependabot.yml.
      - uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0

      - name: Upload gem to release
        continue-on-error: true  # May fail due to IP allow list restrictions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" pkg/rubocop-gusto-*.gem
